<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2a44" />
    <meta name="description" content="개인용 토익 단어 학습과 오답 복습을 위한 단어장" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f2a44'/%3E%3Cpath d='M17 18h30v28H17z' fill='%23fff'/%3E%3Cpath d='M22 26h20M22 33h16' stroke='%23f4cc55' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>토익 포켓 단어장</title>
    <link rel="stylesheet" href="../shared/study-sync.css?v=20261001-sync1" />
    <link rel="stylesheet" href="./styles.css?v=20260927-1" />
  </head>
  <body>
    <a class="skip-link" href="#view-root">본문으로 건너뛰기</a>
    <aside class="sidebar" aria-label="주요 메뉴">
      <button class="brand" type="button" data-view="home" aria-label="토익 포켓 홈">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span><strong>토익 포켓</strong><small>나의 단어, 나의 속도</small></span>
      </button>
      <nav>
        <button class="nav-item active" type="button" data-view="home"><span aria-hidden="true">⌂</span>홈</button>
        <button class="nav-item" type="button" data-view="wordbook"><span aria-hidden="true">A</span>단어장</button>
        <button class="nav-item" type="button" data-view="study"><span aria-hidden="true">▣</span>암기 카드</button>
        <button class="nav-item" type="button" data-view="quiz"><span aria-hidden="true">✓</span>퀴즈</button>
        <button class="nav-item" type="button" data-view="mistakes"><span aria-hidden="true">!</span>오답노트</button>
      </nav>
      <p class="storage-note">이 브라우저에 저장됨</p>
    </aside>

    <div class="app-shell">
      <header class="mobile-header">
        <button class="brand compact" type="button" data-view="home" aria-label="토익 포켓 홈">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span><strong>토익 포켓</strong></span>
        </button>
        <button class="icon-button" type="button" data-action="open-word-dialog" aria-label="새 단어 추가">＋</button>
      </header>
      <main id="view-root" tabindex="-1"></main>
    </div>

    <nav class="mobile-nav" aria-label="모바일 주요 메뉴">
      <button class="active" type="button" data-view="home"><span aria-hidden="true">⌂</span>홈</button>
      <button type="button" data-view="wordbook"><span aria-hidden="true">A</span>단어장</button>
      <button type="button" data-view="study"><span aria-hidden="true">▣</span>카드</button>
      <button type="button" data-view="quiz"><span aria-hidden="true">✓</span>퀴즈</button>
      <button type="button" data-view="mistakes"><span aria-hidden="true">!</span>오답</button>
    </nav>

    <dialog id="word-dialog" class="app-dialog" aria-labelledby="word-dialog-title">
      <form id="word-form" method="dialog">
        <div class="dialog-heading">
          <div><p class="eyebrow">내 단어장</p><h2 id="word-dialog-title">새 단어 추가</h2></div>
          <button class="icon-button" type="button" data-action="close-word-dialog" aria-label="닫기">×</button>
        </div>
        <div class="form-grid two-columns">
          <label><span>영어 단어 <b aria-hidden="true">*</b></span><input id="word-input" name="word" required autocomplete="off" placeholder="예: appointment" /></label>
          <label><span>품사</span><select id="part-input" name="partOfSpeech"><option value="">선택 안 함</option><option>명사</option><option>동사</option><option>형용사</option><option>부사</option><option>전치사</option><option>접속사</option><option>숙어</option><option>기타</option></select></label>
        </div>
        <label><span>한글 뜻 <b aria-hidden="true">*</b> <small>여러 뜻은 쉼표로 구분</small></span><input id="meanings-input" name="meanings" required autocomplete="off" placeholder="약속, 예약" /></label>
        <label><span>영어 예문</span><textarea id="example-input" name="example" rows="2" placeholder="Please confirm your appointment by Friday."></textarea></label>
        <label><span>예문 해석</span><textarea id="translation-input" name="translation" rows="2" placeholder="금요일까지 예약을 확인해 주세요."></textarea></label>
        <div class="form-grid two-columns">
          <label><span>메모</span><input id="memo-input" name="memo" autocomplete="off" placeholder="기억할 내용" /></label>
          <label><span>태그 <small>쉼표로 구분</small></span><input id="tags-input" name="tags" autocomplete="off" placeholder="일정, 기초" /></label>
        </div>
        <p id="word-form-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="ghost-button" type="button" data-action="close-word-dialog">취소</button><button class="primary-button" type="submit">내 단어장에 저장</button></div>
      </form>
    </dialog>

    <dialog id="bulk-dialog" class="app-dialog wide" aria-labelledby="bulk-dialog-title">
      <form id="bulk-form" method="dialog">
        <div class="dialog-heading">
          <div><p class="eyebrow">여러 단어 등록</p><h2 id="bulk-dialog-title">한 번에 붙여 넣기</h2></div>
          <button class="icon-button" type="button" data-action="close-bulk-dialog" aria-label="닫기">×</button>
        </div>
        <div class="format-guide">
          <strong>한 줄에 단어 하나</strong>
          <code>영단어 | 뜻1, 뜻2 | 품사 | 영어 예문 | 예문 해석 | 태그</code>
          <p>간단히 <b>단어 : 뜻</b>으로 적어도 됩니다. 같은 단어는 뜻·메모를 합칩니다.</p>
        </div>
        <label><span>붙여 넣을 단어</span><textarea id="bulk-input" rows="11" required placeholder="confirm | 확인하다, 확정하다 | 동사 | Please confirm your reservation. | 예약을 확인해 주세요. | 일정, 기초&#10;applicant | 지원자 | 명사 | We interviewed five applicants. | 우리는 지원자 다섯 명을 면접했습니다. | 채용"></textarea></label>
        <p id="bulk-form-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="ghost-button" type="button" data-action="close-bulk-dialog">취소</button><button class="primary-button" type="submit">단어 일괄 추가</button></div>
      </form>
    </dialog>

    <input id="import-file" type="file" accept=".json,.csv,application/json,text/csv" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./main.js?v=20261001-sync1"></script>
  </body>
</html>
